---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ipslices.multinetwork.networking.x-k8s.io
spec:
  group: multinetwork.networking.x-k8s.io
  names:
    kind: IPSlice
    listKind: IPSliceList
    plural: ipslices
    shortNames:
    - ipsl
    singular: ipslice
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.podNetworkRef.name
      name: Network
      type: string
    - jsonPath: .spec.podNetworkRef.kind
      name: Kind
      type: string
    - jsonPath: .spec.podNetworkRef.namespace
      name: Namespace
      priority: 1
      type: string
    - jsonPath: .spec.sliceSubnet.networkAddress
      name: NetworkAddress
      type: integer
    - jsonPath: .spec.sliceSubnet.prefixLength
      name: Prefix
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IPSlice describes a slice of IP addresses.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec is the desired state of the IPSlice.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
            properties:
              podNetworkRef:
                description: |-
                  PodNetworkRef identifies the pod network that this IP slice is associated with.
                  This field is part of the block identity encoded in the object name; it is immutable.
                properties:
                  kind:
                    description: Kind identifies the NetworkKind responsible for the
                      pod network.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  name:
                    description: Name identifies the pod network object.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  namespace:
                    description: |-
                      Namespace identifies the namespace of the pod network object.
                      Optional if the pod network object is a non-namespace object.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: podNetworkRef is immutable; create a new IPSlice for a
                    different block
                  rule: self == oldSelf
              request:
                description: Request is the list of IP requests for this IP slice.
                items:
                  description: |-
                    Request asks the allocator for one IP address.

                    By default the IP is taken from anywhere in the slice. A request MAY narrow
                    where the IP comes from by naming a subnet (networkAddress + prefixLength): the
                    allocator then picks a free IP from the intersection of that subnet and this
                    slice. The two fields are set together or not at all, and the subnet must be
                    aligned. The subnet only has to be COMPATIBLE with the slice — one must contain
                    the other (a tighter subnet inside the slice, or a broader subnet that contains
                    it); a disjoint subnet is rejected (see the root "request subnet" rule).
                  properties:
                    name:
                      description: Name identifies the request.
                      maxLength: 63
                      type: string
                    networkAddress:
                      description: |-
                        NetworkAddress is the network address of the subnet to allocate from,
                        as an integer (int(192.168.0.4) == 3232235524). Optional: set together
                        with prefixLength to constrain the allocation to a subnet, or omit both
                        to allocate from anywhere in the slice. Immutable once set.
                      format: int64
                      maximum: 4294967295
                      minimum: 0
                      type: integer
                      x-kubernetes-validations:
                      - message: a request's networkAddress is immutable; remove the
                          request and add a new one to change its subnet
                        rule: self == oldSelf
                    prefixLength:
                      description: |-
                        PrefixLength is the prefix length of the subnet to allocate from.
                        Optional: set together with networkAddress. Immutable once set.
                      format: int32
                      maximum: 32
                      minimum: 0
                      type: integer
                      x-kubernetes-validations:
                      - message: a request's prefixLength is immutable; remove the
                          request and add a new one to change its subnet
                        rule: self == oldSelf
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: networkAddress and prefixLength must be set together
                      (a request's subnet), or both omitted (allocate from anywhere
                      in the slice)
                    rule: has(self.networkAddress) == has(self.prefixLength)
                  - message: a request's networkAddress must be aligned to its prefixLength
                      (a multiple of the subnet size)
                    rule: '!has(self.networkAddress) || self.networkAddress % (self.prefixLength
                      == 32 ? 1 : self.prefixLength == 31 ? 2 : self.prefixLength
                      == 30 ? 4 : self.prefixLength == 29 ? 8 : self.prefixLength
                      == 28 ? 16 : self.prefixLength == 27 ? 32 : self.prefixLength
                      == 26 ? 64 : self.prefixLength == 25 ? 128 : self.prefixLength
                      == 24 ? 256 : self.prefixLength == 23 ? 512 : self.prefixLength
                      == 22 ? 1024 : self.prefixLength == 21 ? 2048 : self.prefixLength
                      == 20 ? 4096 : self.prefixLength == 19 ? 8192 : self.prefixLength
                      == 18 ? 16384 : self.prefixLength == 17 ? 32768 : self.prefixLength
                      == 16 ? 65536 : self.prefixLength == 15 ? 131072 : self.prefixLength
                      == 14 ? 262144 : self.prefixLength == 13 ? 524288 : self.prefixLength
                      == 12 ? 1048576 : self.prefixLength == 11 ? 2097152 : self.prefixLength
                      == 10 ? 4194304 : self.prefixLength == 9 ? 8388608 : self.prefixLength
                      == 8 ? 16777216 : self.prefixLength == 7 ? 33554432 : self.prefixLength
                      == 6 ? 67108864 : self.prefixLength == 5 ? 134217728 : self.prefixLength
                      == 4 ? 268435456 : self.prefixLength == 3 ? 536870912 : self.prefixLength
                      == 2 ? 1073741824 : self.prefixLength == 1 ? 2147483648 : 4294967296)
                      == 0'
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              sliceSubnet:
                description: |-
                  SliceSubnet is the subnet for this IP slice.

                  The slice size is a fixed system-wide constant: every slice is a /26
                  (prefixLength 26, addressSpace 64). This is what makes the blocks a true
                  partition — with a fixed size and an aligned networkAddress, every IPv4
                  address belongs to exactly one slice, so disjointness holds WITHOUT any
                  cross-object check (rule 2). networkAddress alone (plus podNetworkRef) is
                  therefore the block identity encoded in the name; it is immutable.

                  If you ever change the slice size, change all four in lockstep: the two
                  constants below, the alignment modulus, and the usable-range root rule.
                properties:
                  addressSpace:
                    description: |-
                      AddressSpace is the address space of the subnet.
                      For IPv4, the address space is 2^(32 - prefixLength).
                      For IPv6, the address space is 2^(128 - prefixLength).
                    format: int32
                    minimum: 1
                    type: integer
                  networkAddress:
                    description: |-
                      NetworkAddress is the network address of the subnet.
                      Bounded to the IPv4 range; it is part of the block identity encoded in the
                      object name, so it must stay a bounded, stringifiable integer.
                    format: int64
                    maximum: 4294967295
                    minimum: 0
                    type: integer
                  prefixLength:
                    description: PrefixLength is the prefix length of the subnet.
                    format: int32
                    maximum: 32
                    minimum: 0
                    type: integer
                required:
                - addressSpace
                - networkAddress
                - prefixLength
                type: object
                x-kubernetes-validations:
                - message: sliceSubnet is immutable; create a new IPSlice for a different
                    block
                  rule: self == oldSelf
                - message: 'slice size is fixed: sliceSubnet.prefixLength must be
                    26 (a /26)'
                  rule: self.prefixLength == 26
                - message: 'slice size is fixed: sliceSubnet.addressSpace must be
                    64 (a /26)'
                  rule: self.addressSpace == 64
                - message: sliceSubnet.networkAddress must be aligned to the /26 grid
                    (a multiple of 64)
                  rule: self.networkAddress % 64 == 0
            required:
            - podNetworkRef
            - sliceSubnet
            type: object
          status:
            description: |-
              status is the current state of the IPSlice.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
            properties:
              allocation:
                description: Allocation is the list of IP allocations for this IP
                  slice.
                items:
                  properties:
                    address:
                      description: |-
                        Address is the allocated IP address in string format.
                        Max "255.255.255.255" == 15 chars.
                      maxLength: 15
                      type: string
                    ip:
                      description: |-
                        IP is the allocated IP address.
                        Bounded to the IPv4 range so CEL cost estimation of string(ip) stays cheap.
                      format: int64
                      maximum: 4294967295
                      minimum: 0
                      type: integer
                    requestName:
                      description: Name identifies from which request this allocation
                        was made.
                      maxLength: 63
                      type: string
                  required:
                  - address
                  - ip
                  - requestName
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - requestName
                x-kubernetes-list-type: map
            type: object
        type: object
        x-kubernetes-validations:
        - message: every spec.request must be allocated in status (add new requests
            one at a time, or the slice is full)
          rule: '!has(self.spec.request) || self.spec.request.all(r, has(self.status)
            && has(self.status.allocation) && self.status.allocation.exists(a, a.requestName
            == r.name))'
        - message: status.allocation has an entry with no matching spec.request
          rule: '!has(self.status) || !has(self.status.allocation) || self.status.allocation.all(a,
            has(self.spec.request) && self.spec.request.exists(r, r.name == a.requestName))'
        - message: an allocated IP is outside the slice range
          rule: '!has(self.status) || !has(self.status.allocation) || self.status.allocation.all(a,
            a.ip >= self.spec.sliceSubnet.networkAddress && a.ip <= self.spec.sliceSubnet.networkAddress
            + self.spec.sliceSubnet.addressSpace - 1)'
        - message: duplicate IP in status.allocation
          rule: '!has(self.status) || !has(self.status.allocation) || self.status.allocation.all(a,
            size(self.status.allocation.filter(x, x.ip == a.ip)) == 1)'
        - message: an existing allocation IP cannot change (only released by removing
            its request)
          rule: '!has(oldSelf.status) || !has(oldSelf.status.allocation) || oldSelf.status.allocation.all(o,
            !(has(self.spec.request) && self.spec.request.exists(r, r.name == o.requestName))
            || (has(self.status) && has(self.status.allocation) && self.status.allocation.exists(a,
            a.requestName == o.requestName && a.ip == o.ip)))'
        - message: a request subnet is disjoint from this slice; the slice and the
            request subnet must contain one another
          rule: '!has(self.spec.request) || self.spec.request.all(r, !has(r.networkAddress)
            || (r.networkAddress < self.spec.sliceSubnet.networkAddress + self.spec.sliceSubnet.addressSpace
            && self.spec.sliceSubnet.networkAddress < r.networkAddress + (r.prefixLength
            == 32 ? 1 : r.prefixLength == 31 ? 2 : r.prefixLength == 30 ? 4 : r.prefixLength
            == 29 ? 8 : r.prefixLength == 28 ? 16 : r.prefixLength == 27 ? 32 : r.prefixLength
            == 26 ? 64 : r.prefixLength == 25 ? 128 : r.prefixLength == 24 ? 256 :
            r.prefixLength == 23 ? 512 : r.prefixLength == 22 ? 1024 : r.prefixLength
            == 21 ? 2048 : r.prefixLength == 20 ? 4096 : r.prefixLength == 19 ? 8192
            : r.prefixLength == 18 ? 16384 : r.prefixLength == 17 ? 32768 : r.prefixLength
            == 16 ? 65536 : r.prefixLength == 15 ? 131072 : r.prefixLength == 14 ?
            262144 : r.prefixLength == 13 ? 524288 : r.prefixLength == 12 ? 1048576
            : r.prefixLength == 11 ? 2097152 : r.prefixLength == 10 ? 4194304 : r.prefixLength
            == 9 ? 8388608 : r.prefixLength == 8 ? 16777216 : r.prefixLength == 7
            ? 33554432 : r.prefixLength == 6 ? 67108864 : r.prefixLength == 5 ? 134217728
            : r.prefixLength == 4 ? 268435456 : r.prefixLength == 3 ? 536870912 :
            r.prefixLength == 2 ? 1073741824 : r.prefixLength == 1 ? 2147483648 :
            4294967296)))'
        - message: an allocated IP is outside its request's subnet
          rule: '!has(self.status) || !has(self.status.allocation) || self.status.allocation.all(a,
            self.spec.request.exists(r, r.name == a.requestName && (!has(r.networkAddress)
            || (a.ip >= r.networkAddress && a.ip < r.networkAddress + (r.prefixLength
            == 32 ? 1 : r.prefixLength == 31 ? 2 : r.prefixLength == 30 ? 4 : r.prefixLength
            == 29 ? 8 : r.prefixLength == 28 ? 16 : r.prefixLength == 27 ? 32 : r.prefixLength
            == 26 ? 64 : r.prefixLength == 25 ? 128 : r.prefixLength == 24 ? 256 :
            r.prefixLength == 23 ? 512 : r.prefixLength == 22 ? 1024 : r.prefixLength
            == 21 ? 2048 : r.prefixLength == 20 ? 4096 : r.prefixLength == 19 ? 8192
            : r.prefixLength == 18 ? 16384 : r.prefixLength == 17 ? 32768 : r.prefixLength
            == 16 ? 65536 : r.prefixLength == 15 ? 131072 : r.prefixLength == 14 ?
            262144 : r.prefixLength == 13 ? 524288 : r.prefixLength == 12 ? 1048576
            : r.prefixLength == 11 ? 2097152 : r.prefixLength == 10 ? 4194304 : r.prefixLength
            == 9 ? 8388608 : r.prefixLength == 8 ? 16777216 : r.prefixLength == 7
            ? 33554432 : r.prefixLength == 6 ? 67108864 : r.prefixLength == 5 ? 134217728
            : r.prefixLength == 4 ? 268435456 : r.prefixLength == 3 ? 536870912 :
            r.prefixLength == 2 ? 1073741824 : r.prefixLength == 1 ? 2147483648 :
            4294967296)))))'
    served: true
    storage: true
    subresources: {}
