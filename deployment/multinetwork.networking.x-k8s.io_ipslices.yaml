---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ipslices.multinetwork.networking.x-k8s.io
spec:
  group: multinetwork.networking.x-k8s.io
  names:
    kind: IPSlice
    listKind: IPSliceList
    plural: ipslices
    shortNames:
    - ipsl
    singular: ipslice
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.podNetworkRef.name
      name: Network
      type: string
    - jsonPath: .spec.podNetworkRef.kind
      name: Kind
      type: string
    - jsonPath: .spec.podNetworkRef.namespace
      name: Namespace
      priority: 1
      type: string
    - jsonPath: .spec.sliceSubnet.family
      name: Family
      type: string
    - jsonPath: .spec.sliceSubnet.prefix
      name: Prefix
      type: string
    - jsonPath: .spec.sliceSubnet.prefixLength
      name: PrefixLength
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IPSlice describes a slice of IP addresses.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec is the desired state of the IPSlice.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
            properties:
              node:
                description: |-
                  Node identifies the Kubernetes node that currently holds ownership of this slice.
                  When set, all requests in this slice must originate from this node.
                  When the last request in the slice is removed, this field is cleared back to empty.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              podNetworkRef:
                description: |-
                  PodNetworkRef identifies the pod network that this IP slice is associated with.
                  This field is part of the block identity encoded in the object name; it is immutable.
                properties:
                  kind:
                    description: Kind identifies the NetworkKind responsible for the
                      pod network.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  name:
                    description: Name identifies the pod network object.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  namespace:
                    description: |-
                      Namespace identifies the namespace of the pod network object.
                      Optional if the pod network object is a non-namespace object.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: podNetworkRef is immutable; create a new IPSlice for a
                    different block
                  rule: self == oldSelf
              request:
                description: Request is the list of IP requests for this IP slice.
                items:
                  description: |-
                    Request asks the allocator for one IP address.

                    By default the address is taken from anywhere in the slice. A request MAY narrow
                    where it comes from with an OFFSET WINDOW: offset (the first host offset within
                    the slice) plus length (the number of addresses). The allocator then picks the
                    lowest free offset in [offset, offset+length-1]. The two fields are set together
                    or not at all; the window must be aligned (offset % length == 0), a power of two
                    in size, and fit inside the slice (checked by the root rules). Offsets are
                    family-agnostic small integers, so this works identically for IPv4 and IPv6.
                  properties:
                    deviceRef:
                      description: |-
                        DeviceRef identifies the allocated device in a DRA ResourceClaim for this request.
                        When set, the request name can be derived deterministically from it.
                        Immutable once set.
                      properties:
                        claimName:
                          description: ClaimName is the name of the ResourceClaim.
                          maxLength: 253
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        claimNamespace:
                          description: ClaimNamespace is the namespace of the ResourceClaim.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        device:
                          description: Device is the name of the allocated device
                            in the ResourceClaim.
                          maxLength: 253
                          type: string
                      required:
                      - claimName
                      - claimNamespace
                      - device
                      type: object
                      x-kubernetes-validations:
                      - message: a request's deviceRef is immutable
                        rule: self == oldSelf
                    length:
                      description: |-
                        Length is the size of the window to allocate from (a power of two).
                        Optional: set together with offset. Immutable once set.
                      format: int32
                      maximum: 64
                      minimum: 1
                      type: integer
                      x-kubernetes-validations:
                      - message: a request's length is immutable; remove the request
                          and add a new one to change its window
                        rule: self == oldSelf
                    name:
                      description: Name identifies the request.
                      maxLength: 63
                      type: string
                    node:
                      description: |-
                        Node is the name of the Kubernetes node where the request originates.
                        If the enclosing slice specifies spec.node, this field must match spec.node.
                        Immutable once set.
                      maxLength: 253
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                      x-kubernetes-validations:
                      - message: a request's node is immutable; remove the request
                          and add a new one to change its node
                        rule: self == oldSelf
                    offset:
                      description: |-
                        Offset is the first host offset (within the slice) of the window to allocate
                        from, 0 .. 63. Optional: set together with length to constrain
                        the allocation to a window, or omit both to allocate from anywhere in the
                        slice. Immutable once set.
                      format: int32
                      maximum: 63
                      minimum: 0
                      type: integer
                      x-kubernetes-validations:
                      - message: a request's offset is immutable; remove the request
                          and add a new one to change its window
                        rule: self == oldSelf
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: a request's window must specify offset and power-of-two
                      length (1, 2, 4, 8, 16, 32 or 64) with aligned offset, or omit
                      both
                    rule: (!has(self.offset) && !has(self.length)) || (has(self.offset)
                      && has(self.length) && self.offset % self.length == 0 && (self.length
                      == 1 || self.length == 2 || self.length == 4 || self.length
                      == 8 || self.length == 16 || self.length == 32 || self.length
                      == 64))
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              sliceSubnet:
                description: |-
                  SliceSubnet is the subnet for this IP slice.

                  The slice size is a fixed system-wide constant: every slice holds 64
                  addresses -- a /26 for IPv4, a /122 for IPv6. The size is not a field: it is
                  implied by the pinned prefixLength (below) and baked into the offset bounds
                  (0..63) as literals. This is what makes the blocks a true partition: with a
                  fixed size and a network-aligned prefix, every address belongs to exactly one
                  slice, so disjointness holds WITHOUT any cross-object check (rule 2). The
                  prefix (plus podNetworkRef) is the block identity encoded in the name; the
                  whole subnet is immutable.

                  Uniqueness across families relies on the prefix being CANONICAL: unlike an
                  integer, a text IP has many spellings for one network. ip.isCanonical()
                  enforces the single canonical form in CEL, so a canonical prefix maps to
                  exactly one name (see pkg/naming.Name and the VAP).

                  If you ever change the slice size, change these in lockstep: the pinned
                  prefixLengths, the offset bounds (0..63 on Request/Allocation and the "< 64"
                  root rules), and MaxItems on the lists.
                  The prefix length is a family-branched string LITERAL ('/26' or '/122'), not
                  string(self.prefixLength): the CRD's static cost estimator sizes string(int)
                  by the integer's max magnitude, which inflates the concatenated CIDR string
                  and pushes this rule >100x over budget. prefixLength is already pinned per
                  family (rule above), so the literal is exact and keeps the check in the CRD
                  (where it always runs and can't be unbound) instead of a VAP.
                properties:
                  family:
                    description: 'Family is the IP family of the slice: "IPv4" or
                      "IPv6".'
                    enum:
                    - IPv4
                    - IPv6
                    type: string
                  prefix:
                    description: |-
                      Prefix is the network address of the subnet, as a canonical IP string
                      (e.g. "192.168.0.0" or "fe80::"). It is part of the block identity encoded in
                      the object name. CEL does no arithmetic on it; the IP/CIDR CEL libraries
                      validate it. Must be canonical (ip.isCanonical) so the identity -> name
                      mapping is unambiguous. Max IPv6 text length is 45 chars.
                    maxLength: 45
                    type: string
                  prefixLength:
                    description: |-
                      PrefixLength is the prefix length of the subnet: 26 for IPv4, 122 for IPv6
                      (both cover 64 addresses). This is what fixes the slice size; there is no
                      separate addressSpace field (the size is implied and baked into the offset
                      bounds 0..63).
                    format: int32
                    maximum: 128
                    minimum: 0
                    type: integer
                required:
                - family
                - prefix
                - prefixLength
                type: object
                x-kubernetes-validations:
                - message: sliceSubnet is immutable; create a new IPSlice for a different
                    block
                  rule: self == oldSelf
                - message: sliceSubnet.prefix must be a valid IP address
                  rule: isIP(self.prefix)
                - message: sliceSubnet.prefix must be in canonical form (e.g. lowercase,
                    compressed IPv6)
                  rule: '!isIP(self.prefix) || ip.isCanonical(self.prefix)'
                - message: sliceSubnet.prefix family must match sliceSubnet.family
                  rule: '!isIP(self.prefix) || ip(self.prefix).family() == (self.family
                    == ''IPv4'' ? 4 : 6)'
                - message: 'slice size is fixed: prefixLength must be 26 for IPv4
                    or 122 for IPv6 (both are 64 addresses)'
                  rule: 'self.family == ''IPv4'' ? self.prefixLength == 26 : self.prefixLength
                    == 122'
                - message: sliceSubnet.prefix must be the network address (host bits
                    zero) aligned to prefixLength
                  rule: '!isIP(self.prefix) || string(cidr(self.prefix + (self.family
                    == ''IPv4'' ? ''/26'' : ''/122'')).masked().ip()) == self.prefix'
            required:
            - podNetworkRef
            - sliceSubnet
            type: object
          status:
            description: |-
              status is the current state of the IPSlice.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
            properties:
              allocation:
                description: Allocation is the list of IP allocations for this IP
                  slice.
                items:
                  properties:
                    address:
                      description: |-
                        Address is the allocated IP address in string format, rendered by the
                        allocator. It is set for IPv4 (which CEL can render from prefix + offset with
                        exact integer arithmetic) and omitted for IPv6 (which CEL cannot render:
                        there is no 128-bit arithmetic). For IPv6, consumers derive the address from
                        the slice prefix and this offset. Max IPv6 text length is 45 chars.
                      maxLength: 45
                      type: string
                    offset:
                      description: |-
                        Offset is the allocated host offset within the slice, 0 .. 63.
                        This is the load-bearing value: the concrete address is (prefix + offset).
                      format: int32
                      maximum: 63
                      minimum: 0
                      type: integer
                    requestName:
                      description: Name identifies from which request this allocation
                        was made.
                      maxLength: 63
                      type: string
                  required:
                  - offset
                  - requestName
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - requestName
                x-kubernetes-list-type: map
              bitmap:
                description: Bitmap tracks offset allocation state as a 64-character
                  string of '0' (free) and '1' (occupied).
                maxLength: 64
                pattern: ^[01]*$
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: every spec.request must be allocated in status (the slice may be
            full)
          rule: '!has(self.spec.request) || (has(self.status) && has(self.status.allocation)
            && size(self.status.allocation) == size(self.spec.request))'
        - message: status.allocation has an entry with no matching spec.request
          rule: '!has(self.status) || !has(self.status.allocation) || size(self.status.allocation)
            <= (has(self.spec.request) ? size(self.spec.request) : 0)'
        - message: an allocated offset is outside the slice range
          rule: '!has(self.status) || !has(self.status.allocation) || self.status.allocation.all(a,
            a.offset >= 0 && a.offset < 64)'
        - message: a request's offset window must fit inside the slice (offset + length
            <= 64)
          rule: '!has(self.spec.request) || self.spec.request.all(r, !has(r.offset)
            || r.offset + r.length <= 64)'
        - message: every request in the slice must have node set matching spec.node
          rule: '!has(self.spec.node) || self.spec.node == '''' || !has(self.spec.request)
            || self.spec.request.all(r, has(r.node) && r.node == self.spec.node)'
    served: true
    storage: true
    subresources: {}
