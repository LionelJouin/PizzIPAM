# Backstop for the invariants the CRD schema cannot express, and the name
# enforcement that makes naming server-owned.
#
# Everything that fits the CRD's static cost budget lives in the CRD schema
# (apis/v1alpha1/types.go markers): field ranges, list caps, immutability, the
# offset/window rules, and the prefix validity/canonicality/alignment checks (via
# the IP/CIDR CEL libraries). The two checks below live here:
#   1. metadata.name == canonical name. This is the naming contract, enforced.
#   2. IPv4 allocation.address == render(prefix, offset). Its natural form builds a
#      string with string(int); the CRD's STATIC cost estimator sizes string(int)
#      by the value's magnitude and over-budgets it, so it runs here at RUNTIME on
#      small octet values instead. IPv6 stores no address, so this only checks v4.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ipslice-invariants
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   ["multinetwork.networking.x-k8s.io"]
      apiVersions: ["v1alpha1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["ipslices"]
  variables:
  # sliceId is the family-agnostic block identity encoded in the name:
  # "<family-lower>-<sanitized-canonical-prefix>-<prefixLength>". Only computed
  # on CREATE since metadata.name and identity fields are immutable.
  - name: sliceId
    expression: >-
      oldObject != null ? "" :
      (object.spec.sliceSubnet.family.lowerAscii() + "-" +
       object.spec.sliceSubnet.prefix.replace(".", "-").replace(":", "-") + "-" +
       string(object.spec.sliceSubnet.prefixLength))
  - name: allocs
    expression: >-
      (has(object.status) && has(object.status.allocation)) ? object.status.allocation : []
  - name: allocOffsets
    expression: "variables.allocs.map(a, a.offset)"
  - name: allocNames
    expression: "variables.allocs.map(a, a.requestName)"
  - name: v4parts
    expression: >-
      object.spec.sliceSubnet.family == "IPv4" ? object.spec.sliceSubnet.prefix.split(".") : []
  - name: v4base
    expression: >-
      size(variables.v4parts) == 4 ? variables.v4parts[0] + "." + variables.v4parts[1] + "." + variables.v4parts[2] + "." : ""
  - name: v4lastOctet
    expression: "size(variables.v4parts) == 4 ? int(variables.v4parts[3]) : 0"
  validations:
  # 1. metadata.name MUST be the canonical name for the block identity. Each
  #    identity has exactly one legal name, so a wrong name is denied and a second
  #    object for the same block collides on create -> never two objects for one
  #    block, and clients cannot invent names. (Skipped on UPDATE since name is immutable).
  - expression: >-
      oldObject != null ||
      object.metadata.name ==
        object.spec.podNetworkRef.name + "." +
        object.spec.podNetworkRef.kind +
        ((has(object.spec.podNetworkRef.namespace) && object.spec.podNetworkRef.namespace != "")
          ? "." + object.spec.podNetworkRef.namespace : "") + "." +
        variables.sliceId
    message: "metadata.name must be the canonical name for this block's identity (see pkg/naming.Name); it is derived, not chosen"
    reason: Invalid
  # 2. Address render invariant:
  #    - For IPv4: allocation.address MUST be present and match the dotted render of (prefix, offset).
  #    - For IPv6: allocation.address MUST be omitted (consumers derive address from prefix + offset).
  - expression: >-
      object.spec.sliceSubnet.family == "IPv4"
        ? variables.allocs.all(a, has(a.address) && a.address == (variables.v4base + string(variables.v4lastOctet + a.offset)))
        : variables.allocs.all(a, !has(a.address) || a.address == "")
    message: "allocation.address invalid (IPv4 requires rendered address matching prefix+offset; IPv6 must omit address)"
    reason: Invalid
  # 3. No duplicate offset in status.allocation. Moved from CRD to VAP so it only
  #    runs once on admission rather than on every internal storage retry.
  - expression: >-
      variables.allocOffsets.all(o, size(variables.allocOffsets.filter(x, x == o)) == 1)
    message: "duplicate offset in status.allocation"
    reason: Invalid
  # 4. An existing allocation offset cannot change.
  - expression: >-
      oldObject == null || !has(oldObject.status) || !has(oldObject.status.allocation) ||
      oldObject.status.allocation.all(o,
        !(has(object.spec.request) && object.spec.request.exists(r, r.name == o.requestName)) ||
        (has(object.status) && has(object.status.allocation) &&
         object.status.allocation.exists(a, a.requestName == o.requestName && a.offset == o.offset)))
    message: "an existing allocation offset cannot change (only released by removing its request)"
    reason: Invalid
  # 5. An allocated offset lies inside its request's window.
  - expression: >-
      variables.allocs.all(a,
        object.spec.request.exists(r, r.name == a.requestName &&
          (!has(r.offset) || (a.offset >= r.offset && a.offset < r.offset + r.length))))
    message: "an allocated offset is outside its request's window"
    reason: Invalid
  # 6. Every spec.request matches an allocation in status.allocation.
  - expression: >-
      !has(object.spec.request) ||
      object.spec.request.all(r, r.name in variables.allocNames)
    message: "every spec.request must be allocated in status"
    reason: Invalid
  # 7. At most one request may be removed in a single write.
  - expression: >-
      oldObject == null || !has(oldObject.spec.request) ||
      size(oldObject.spec.request.filter(r, !(r.name in (has(object.spec.request) ? object.spec.request.map(x, x.name) : [])))) <= 1
    message: "at most one request may be removed in a single write"
    reason: Invalid
  # 8. An existing slice node lock cannot be changed while requests still exist.
  - expression: >-
      oldObject == null || !has(oldObject.spec.node) || oldObject.spec.node == "" ||
      !has(object.spec.request) || size(object.spec.request) == 0 ||
      (has(object.spec.node) && object.spec.node == oldObject.spec.node)
    message: "spec.node cannot be changed while requests still exist in the slice"
    reason: Invalid
  # 9. If request.deviceRef is set, request.name must match the deterministic device name.
  - expression: >-
      !has(object.spec.request) ||
      object.spec.request.all(r,
        !has(r.deviceRef) ||
        r.name == (r.deviceRef.claimNamespace + "." + r.deviceRef.claimName + "." + r.deviceRef.device))
    message: "request name must match deviceRef (claimNamespace.claimName.device)"
    reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ipslice-invariants-binding
spec:
  policyName: ipslice-invariants
  validationActions: ["Deny"]
