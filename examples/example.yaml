# This slice owns 192.168.0.0/26  (all 64 allocatable offsets: 0 - 63).
#
# The allocator reasons in host OFFSETS, so the same shape works for any family:
# swap family/prefix/prefixLength for an IPv6 /122 and nothing else changes.
apiVersion: multinetwork.networking.x-k8s.io/v1alpha1
kind: IPSlice
metadata:
  # Canonical, server-enforced name for this identity (see pkg/naming.Name):
  #   <name>.<kind>[.<namespace>].<family-lower>-<sanitized-prefix>-<prefixLength>
  name: abc.blue-network.ipv4-192-168-0-0-26
spec:
  podNetworkRef:
    name: abc
    kind: blue-network
  sliceSubnet: # 192.168.0.0/26 (slice size is a fixed /26 = 64 addresses)
    family: IPv4
    prefix: 192.168.0.0 # canonical network address (host bits zero)
    prefixLength: 26
  request:
  - name: alpha # no window -> gets the lowest free offset (0)
  # A request may narrow to an OFFSET window inside the slice with offset+length
  # (length a power of two, offset a multiple of length). E.g. offsets 8..11:
  # - name: beta
  #   offset: 8
  #   length: 4
  - name: m
---
# The identical shape for IPv6: only family/prefix/prefixLength differ. The
# allocation carries the offset only -- consumers derive the address from
# (prefix, offset), since CEL cannot render a 128-bit address.
apiVersion: multinetwork.networking.x-k8s.io/v1alpha1
kind: IPSlice
metadata:
  name: abc.blue-network.ipv6-fe80---122
spec:
  podNetworkRef:
    name: abc
    kind: blue-network
  sliceSubnet: # fe80::/122 (fixed /122 = 64 addresses)
    family: IPv6
    prefix: fe80:: # canonical network address (host bits zero)
    prefixLength: 122
  request:
  - name: alpha
