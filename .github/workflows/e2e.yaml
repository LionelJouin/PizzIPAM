name: e2e

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pizzipam-e2e
          config: hack/kind.yaml
          node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5

      - name: Install CRD and admission policies
        run: |
          kubectl apply -f deployment/multinetwork.networking.x-k8s.io_ipslices.yaml
          kubectl wait --for=condition=Established --timeout=60s \
            crd/ipslices.multinetwork.networking.x-k8s.io
          kubectl apply -f deployment/validating-policy.yaml
          kubectl apply -f deployment/mutating-policy.yaml

      - name: Run e2e tests
        run: make e2e
